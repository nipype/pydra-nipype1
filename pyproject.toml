[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pydra-nipype1"
description = "Tools for importing nipype 1.x interfaces into Pydra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydra >=1.0a0",
    "nipype",
    "attrs >=21.3.0",
]
license = {file = "LICENSE"}
authors = [
    {name = "Chris Markiewicz", email = "markiewicz@stanford.edu"},
]
maintainers = [
    {name = "Nipype developers", email = "neuroimaging@python.org"},
]
keywords = [
    "pydra",
    "nipype",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
]
test = [
    "pytest>=4.4.0",
    "pytest-cov",
]

[project.urls]
homepage = "https://github.com/nipype/pydra-nipype1"
repository = "https://github.com/nipype/pydra-nipype1"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pydra/compose/nipype1/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["pydra"]
include-only = ["pydra/compose/nipype1"]

[tool.setuptools_scm]
write_to = "pydra/compose/nipype1/_version.py"

[tool.black]
line-length = 99
target-version = ["py311"]
exclude = "_version.py"
